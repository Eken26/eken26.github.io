<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eken26 Nexus</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>

  <style>
    body{
      font-family: Arial;
      background:#111827;
      color:white;
      margin:0;
      padding:0;
    }

    .header{
      background:black;
      padding:15px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }

    .card{
      background:#1f2937;
      margin:20px;
      padding:20px;
      border-radius:15px;
      text-align:center;
    }

    button{
      background:#7c3aed;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }

    img{
      width:180px;
      border-radius:20px;
      margin-bottom:15px;
    }
  </style>
</head>

<body>

<div class="header">
  Eken26 Nexus TR
</div>

<div class="card">
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/Pi-network.png">

  <h2>Pi Marketplace</h2>

  <p>
    Global shopping and digital marketplace powered by Pi.
  </p>

  <button id="paybtn">
    Pi ile Ödeme Yap
  </button>
</div>

<script>

document.getElementById("paybtn").onclick = function () {

  Pi.createPayment(
    {
      amount: 1,
      memo: "Eken26 Nexus Demo",
      metadata: { productId: "nexus1" }
    },

    {
      onReadyForServerApproval: function(paymentId) {
        console.log(paymentId);
      },

      onReadyForServerCompletion: function(paymentId, txid) {
        console.log(paymentId, txid);
      },

      onCancel: function(paymentId) {
        console.log("İptal edildi");
      },

      onError: function(error) {
        console.log(error);
      }
    }
  );
};

</script>

</body>
</html>
