<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKEN26 NEXUS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152b, #0b2a4a);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .card {
      margin-top: 35px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #ff8a00;
      color: white;
    }

    .button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 20px;
      min-height: 24px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>EKEN26 NEXUS</h1>

    <p class="subtitle">
      Eken26; Eskişehir ve çevresindeki konaklama, ulaşım,
      tur ve seyahat seçeneklerini bir araya getiren
      bir tanıtım platformudur.
    </p>

    <div class="card">
      <h2>Pi ile Ödeme</h2>

      <p>
        Eken26 Nexus üzerinden Pi ödeme işlemini başlatabilirsiniz.
      </p>

      <button class="button" onclick="makePiPayment()">
        Pi ile Ödeme Yap
      </button>

      <div id="status"></div>
    </div>

  </div>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <script>
    let piReady = Pi.init({
      version: "2.0",
      sandbox: false
    });
let piAuth = null;

async function ensurePiAuth() {
  await piReady;

  if (!piAuth) {
    piAuth = await Pi.authenticate(
      ["username", "payments"],
      onIncompletePaymentFound
    );
  }

  return piAuth;
}

function onIncompletePaymentFound(payment) {
  console.log("Tamamlanmamış ödeme:", payment);
}
    async function makePiPayment() {
      const status = document.getElementById("status");

      try {
        status.textContent = "Pi bağlantısı hazırlanıyor...";
await ensurePiAuth();     
await piReady;
        const paymentData = {
          amount: 1,
          memo: "Eken26 Nexus Hizmet Bedeli",
          metadata: {
            service: "tourism",
            app: "eken26-nexus"
          }
        };

        const callbacks = {

          onReadyForServerApproval: function(paymentId) {
            console.log("Onay bekliyor:", paymentId);
            status.textContent =
              "Ödeme onay aşamasında...";
          },

          onReadyForServerCompletion: function(paymentId, txid) {
            console.log("Ödeme tamamlandı:", paymentId, txid);
            status.textContent =
              "Ödeme işlemi tamamlandı.";
          },

          onCancel: function(paymentId) {
            console.log("Ödeme iptal edildi:", paymentId);
            status.textContent =
              "Ödeme iptal edildi.";
          },

          onError: function(error, payment) {
            console.error("Pi ödeme hatası:", error, payment);
            status.textContent =
              "Ödeme sırasında bir hata oluştu.";
          }
        };

        Pi.createPayment(paymentData, callbacks);

      } catch (error) {
        console.error("Payment flow failed:", error);
        status.textContent =
          "Pi bağlantısı kurulamadı.";
      }
    }
  </script>

</body>
</html>
