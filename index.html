<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eken26 Nexus TR</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    async function piLogin() {
      try {
        const scopes = ['username'];
        const authResult = await Pi.authenticate(scopes, function(payment) {});
        document.getElementById("status").innerText =
          "Pi giriş başarılı: " + authResult.user.username;
      } catch (err) {
        document.getElementById("status").innerText =
          "Pi giriş hatası";
        console.error(err);
      }
    }

    window.onload = function() {
      piLogin();
    };
  </script>
</head>
<body style="font-family: Arial; text-align: center; background:#0f172a; color:white; padding-top:100px;">
  <h1>Eken26 Nexus TR</h1>
  <p>Pi doğrulama test uygulaması</p>
  <p id="status">Pi girişi bekleniyor...</p>
</body>
</html>
