<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eken26 Nexus doriya Demo</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  text-align:center;
  padding-top:60px;
}
.box{
  background:white;
  max-width:420px;
  margin:auto;
  padding:30px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
button{
  background:#6f42c1;
  color:white;
  border:none;
  padding:14px 24px;
  font-size:18px;
  border-radius:10px;
  margin:8px;
}
#status{
  margin-top:20px;
  font-size:18px;
}
</style>
</head>
<body>

<div class="box">
  <h1>Eken26 Nexus doriya</h1>
  <p>Demo Uygulama</p>

  <button id="loginBtn">Demo Giriş</button>
  <button id="payBtn" style="display:none;">Demo Ödeme Testi</button>

  <div id="status">Hazır</div>
</div>

<script>
const statusDiv = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");
const payBtn = document.getElementById("payBtn");

loginBtn.addEventListener("click", function() {
  statusDiv.innerHTML = "Kullanıcı: mustafaeken26";
  payBtn.style.display = "inline-block";
});

payBtn.addEventListener("click", function() {
  statusDiv.innerHTML = "Demo ödeme başarılı (0.01 Pi test)";
});
</script>

</body>
</html>
