<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eken26 Nexus doriya</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f7f7f7;
      padding-top: 80px;
      margin: 0;
    }
    .box {
      background: white;
      max-width: 420px;
      margin: auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    button {
      background: #6f42c1;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      color: green;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Eken26 Nexus doriya</h1>
    <p>Pi kullanıcı doğrulama</p>
    <button onclick="login()">Pi ile Giriş Yap</button>
    <div id="result"></div>
  </div>

  <script>
    Pi.init({ version: "2.0", sandbox: true });

    async function login() {
      try {
        const auth = await Pi.authenticate(
          ['username'],
          function(payment) {},
          function(error) {}
        );

        document.getElementById("result").innerHTML =
          "Giriş başarılı: " + auth.user.username;
      } catch (e) {
        document.getElementById("result").innerHTML =
          "Giriş hatası: " + e.message;
      }
    }
  </script>
</body>
</html>
