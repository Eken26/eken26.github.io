<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Doğrulama Testi</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background: #f5f5f5;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background: #6b46c1;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>Pi Doğrulama Testi</h1>
  <button onclick="loginPi()">Pi ile Giriş Yap</button>
  <div id="status">Hazır</div>

  <script>
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    async function loginPi() {
      try {
        const scopes = ['username'];
        const authResult = await Pi.authenticate(scopes, function(payment) {});
        document.getElementById("status").innerText =
          "Giriş başarılı: " + authResult.user.username;
      } catch (err) {
        document.getElementById("status").innerText =
          "Hata: " + err.message;
      }
    }
  </script>

</body>
</html>
