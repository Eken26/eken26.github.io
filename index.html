<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eken26 Nexus doriya</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  text-align:center;
  padding-top:60px;
}
.box{
  background:white;
  max-width:420px;
  margin:auto;
  padding:30px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
button{
  background:#6f42c1;
  color:white;
  border:none;
  padding:14px 24px;
  font-size:18px;
  border-radius:10px;
  margin:8px;
}
#profile{
  margin-top:20px;
  font-size:18px;
}
</style>
</head>
<body>

<div class="box">
  <h1>Eken26 Nexus doriya</h1>
  <button id="loginBtn">Pi ile Giriş Yap</button>
  <button id="payBtn" style="display:none;">Sandbox Ödeme Testi</button>
  <div id="profile">Hazır</div>
</div>

<script>
let currentUser = null;

document.addEventListener("DOMContentLoaded", function () {
  Pi.init({
    version: "2.0",
    sandbox: true
  });

  document.getElementById("loginBtn").addEventListener("click", async function () {
    try {
      const auth = await Pi.authenticate(["username"], function(){});
      currentUser = auth.user;

      document.getElementById("profile").innerHTML =
        "Kullanıcı: " + currentUser.username;

      document.getElementById("payBtn").style.display = "inline-block";

    } catch (e) {
      document.getElementById("profile").innerHTML =
        "Hata: " + e.message;
    }
  });

  document.getElementById("payBtn").addEventListener("click", async function () {
    try {
      await Pi.createPayment({
        amount: 0.01,
        memo: "Sandbox test ödeme",
        metadata: { type: "test" }
      }, {
        onReadyForServerApproval: function(paymentId) {
          document.getElementById("profile").innerHTML =
            "Ödeme hazır: " + paymentId;
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          document.getElementById("profile").innerHTML =
            "Ödeme tamamlandı";
        },
        onCancel: function(paymentId) {
          document.getElementById("profile").innerHTML =
            "Ödeme iptal edildi";
        },
        onError: function(error) {
          document.getElementById("profile").innerHTML =
            "Ödeme hatası";
        }
      });

    } catch (e) {
      document.getElementById("profile").innerHTML =
        "Ödeme başlatılamadı";
    }
  });
});
</script>

</body>
</html>
