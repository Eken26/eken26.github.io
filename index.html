<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eken26 Nexus TR</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family: Arial; text-align:center; background:#0f172a; color:white; padding-top:100px;">
  <h1>Eken26 Nexus TR</h1>
  <p id="durum">Pi doğrulama test uygulaması</p>

  <script>
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    async function piLogin() {
      try {
        await Pi.authenticate([], function(payment) {});
        document.getElementById("durum").innerText = "Pi giriş başarılı";
      } catch (err) {
        document.getElementById("durum").innerText = "Pi giriş hatası";
        console.error(err);
      }
    }

    window.onload = function() {
      piLogin();
    };
  </script>
</body>
</html>
