<title>Eken26 Nexus</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f2f2f7;
    color:#222;
}

.header{
    background:#6f42c1;
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.title{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.profile{
    font-size:14px;
    background:rgba(255,255,255,.15);
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.search{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

#content{
    padding:15px;
    padding-bottom:110px;
}

.card{
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.card h2{
    margin-bottom:8px;
    font-size:20px;
}

.card p{
    color:#555;
    line-height:1.5;
}

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:10px;
}

.category{
    background:white;
    padding:20px 10px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 2px 7px rgba(0,0,0,.1);
    cursor:pointer;
    font-weight:bold;
}

.category span{
    display:block;
    font-size:28px;
    margin-bottom:8px;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    padding:10px;
    z-index:20;
}

.bottom button{
    background:#6f42c1;
    color:white;
    border:none;
    padding:11px 13px;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
}

.back{
    background:#6f42c1;
    color:white;
    border:none;
    padding:12px 16px;
    border-radius:12px;
    cursor:pointer;
    margin-top:15px;
}

.section-title{
    margin:5px 0 12px;
    font-size:22px;
}

.product{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product h3{
    margin-bottom:7px;
}

.price{
    color:#6f42c1;
    font-weight:bold;
    margin-top:8px;
}

.empty{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}
</style>
</head>

<body>
