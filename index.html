<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eken26 Nexus doriya</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  text-align:center;
  padding-top:80px;
}
.box{
  background:white;
  max-width:420px;
  margin:auto;
  padding:30px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
button{
  background:#6f42c1;
  color:white;
  border:none;
  padding:14px 28px;
  font-size:18px;
  border-radius:10px;
}
#result{
  margin-top:20px;
  font-size:18px;
}
</style>
</head>
<body>

<div class="box">
  <h1>Eken26 Nexus doriya</h1>
  <p>Pi kullanıcı doğrulama</p>
  <button id="loginBtn">Pi ile Giriş Yap</button>
  <div id="result">Hazır</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  Pi.init({
    version: "2.0",
    sandbox: true
  });

  document.getElementById("loginBtn").addEventListener("click", async function () {
    try {
      const auth = await Pi.authenticate(["username"], function(){});
      document.getElementById("result").innerText =
        "Giriş başarılı: " + auth.user.username;
    } catch (e) {
      document.getElementById("result").innerText =
        "Hata: " + e.message;
    }
  });
});
</script>

</body>
</html>
