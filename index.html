<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eken26 Nexus Doriya</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Arial,sans-serif;background:#f1f3f4;color:#18212b}
        header{background:white;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.12);position:sticky;top:0;z-index:100}
        .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:bold;color:#087c73}
        .container{max-width:900px;margin:auto;padding:20px}
        .card{background:white;border-radius:28px;padding:28px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
        .card h1{margin-top:0;font-size:34px}
        .card p{font-size:20px;line-height:1.6;color:#555}
        .buttons{display:flex;gap:15px;margin-top:20px;flex-wrap:wrap}
        button{border:none;background:#087c73;color:white;padding:16px 28px;border-radius:15px;font-size:18px;font-weight:bold;cursor:pointer}
        button:hover{opacity:.9}
    </style>
</head>
<body>

    <header>
        <div class="logo">eken26pi Nexus Doriya</div>
    </header>

    <div class="container">
        <div class="card">
            <h1>👋 Hoş Geldiniz</h1>
            <p>Eken26; Eskişehir ve çevresindeki konaklama, ulaşım, tur ve seyahat seçeneklerini bir araya getiren bir tanıtım platformudur.</p>
            <div class="buttons">
                <button type="button" onclick="makePiPayment()">Pi ile Ödeme Yap</button>
            </div>
        </div>
    </div>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        Pi.init({ version: "2.0", sandbox: true });

        async function makePiPayment() {
            try {
                const paymentData = {
                    amount: 1,
                    memo: "Eken26 Doriya Hizmet Bedeli",
                    metadata: { service: "tourism" },
                };

                const callbacks = {
                    onReadyForServerApproval: (paymentId) => {
                        console.log("On ready for server approval", paymentId);
                    },
                    onReadyForServerCompletion: (paymentId, txid) => {
                        console.log("On ready for server completion", paymentId, txid);
                        alert("Odeme basarili! Simdi Pi Portal'da islemi kontrol et.");
                    },
                    onCancel: (paymentId) => {
                        console.log("Payment cancelled", paymentId);
                    },
                    onError: (error, payment) => {
                        console.error("Payment error", error);
                    }
                };

                const payment = await Pi.createPayment(paymentData, callbacks);
            } catch (error) {
                console.error("Payment flow failed", error);
            }
        }
    </script>
</body>
</html>
