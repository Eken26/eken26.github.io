<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Eken26 Nexus TR</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family: Arial; text-align:center; padding-top:100px;">
  <h1>Pi Doğrulama Testi</h1>
  <p id="status">Giriş bekleniyor...</p>

  <script>
    Pi.init({ version: "2.0", sandbox: true });

    async function login() {
      try {
        await Pi.authenticate([], function(payment) {});
        document.getElementById("status").innerText = "Pi giriş başarılı";
      } catch (e) {
        document.getElementById("status").innerText = "Pi giriş hatası";
        console.log(e);
      }
    }

    window.onload = login;
  </script>
</body>
</html>
